<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallets Kit and MiniGo</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 720px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 1.4rem; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
      button { padding: 8px 12px; font: inherit; cursor: pointer; }
      pre { background: color-mix(in srgb, currentColor 8%, transparent); padding: 12px; border-radius: 8px; overflow: auto; min-height: 8em; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Stellar Wallets Kit v2 and MiniGo (testnet)</h1>
    <p>Open this page inside MiniGo (Profile > Developer, then the URL) or in a browser with the MiniGo extension. Every step goes through <code>StellarWalletsKit</code> and the <code>MiniGoModule</code>.</p>
    <div class="row">
      <button id="connect">Connect</button>
      <button id="address">getAddress</button>
      <button id="network">getNetwork</button>
      <button id="fund">Fund with Friendbot</button>
      <button id="tx">signTransaction</button>
      <button id="submit">Submit signed tx</button>
      <button id="auth">signAuthEntry</button>
      <button id="message">signMessage</button>
      <button id="disconnect">Disconnect</button>
    </div>
    <pre id="log">Ready.</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
